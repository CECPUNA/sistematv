<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Información Académica - CECP</title>
  <link rel="stylesheet" href="css/tv.css">
</head>
<body>

  <header class="tv-header">
    <div class="tv-header__brand">
      <img class="tv-header__logo" src="assets/logo-cecp.png" alt="Centro de Estudiantes - Escuela de Ciencias Políticas">
      <div class="tv-header__brand-text">
        <span class="tv-header__title">CENTRO DE ESTUDIANTES</span>
        <span class="tv-header__subtitle">ESCUELA DE CIENCIAS POLÍTICAS</span>
      </div>
    </div>

    <div class="tv-header__seal">
      <img src="assets/sello-una.png" alt="Universidad Nacional de Asunción">
    </div>

    <div class="tv-header__system">
      <img class="tv-header__logo" src="assets/icono-sistema.png" alt="">
      <div class="tv-header__brand-text">
        <span class="tv-header__title">SISTEMA DE INFORMACIÓN ACADÉMICA - CECP</span>
        <span class="tv-header__subtitle">CENTRO DE ESTUDIANTES - ESCUELA DE CIENCIAS POLITICAS</span>
      </div>
    </div>
  </header>

  <main class="tv-main">

    <section class="tv-panel tv-panel--horarios">
      <h2 class="tv-panel__title">HORARIOS DE CLASE ACTIVOS</h2>
      <div id="horarios-grid" class="tv-horarios-grid"></div>

      <div class="tv-subrow">
        <div class="tv-panel tv-panel--reloj">
          <div class="tv-reloj__analogico" id="reloj-analogico">
            <div class="tv-reloj__manecilla tv-reloj__hora" id="manecilla-hora"></div>
            <div class="tv-reloj__manecilla tv-reloj__minuto" id="manecilla-minuto"></div>
            <div class="tv-reloj__manecilla tv-reloj__segundo" id="manecilla-segundo"></div>
            <div class="tv-reloj__centro"></div>
          </div>
          <div class="tv-reloj__info">
            <div class="tv-reloj__fecha" id="fecha-actual">FECHA</div>
            <div class="tv-reloj__patria" id="proxima-fecha-patria">PRÓXIMA FECHA PATRIA</div>
          </div>
        </div>

        <div class="tv-panel tv-panel--examenes">
          <h2 class="tv-panel__title">FECHAS DE EXÁMENES</h2>
          <div id="examenes-lista" class="tv-examenes-lista"></div>
        </div>
      </div>
    </section>

    <aside class="tv-panel tv-panel--noticias">
      <h2 class="tv-panel__title">NOTICIAS</h2>
      <ul id="noticias-lista" class="tv-noticias-lista"></ul>
    </aside>

  </main>

  <footer id="noticias-footer" class="tv-footer-ticker"></footer>

  <script src="js/tv.js" defer></script>
</body>
</html>
